<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GateForge" />
  <meta name="description" content="GATE 2027 Preparation Tracker — Your personal command centre." />

  <title>GateForge — GATE 2027</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }
    #root { height: 100%; }
    body { background: #0B0F1A; font-family: 'Poppins', sans-serif; }

    /* PWA Install Banner */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 16px;
      right: 16px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      color: white;
      padding: 14px 18px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(99,102,241,0.4);
      z-index: 9999;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: 'Poppins', sans-serif;
      animation: slideUp 0.4s ease forwards;
    }
    #install-banner.show { display: flex; }
    #install-banner p { font-size: 13px; font-weight: 600; flex: 1; }
    #install-banner p span { display: block; font-size: 11px; font-weight: 400; opacity: 0.85; margin-top: 2px; }
    #install-btn {
      background: white;
      color: #6366F1;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      white-space: nowrap;
    }
    #dismiss-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      opacity: 0.8;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Loading screen */
    #loading {
      position: fixed; inset: 0;
      background: #0B0F1A;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .load-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      box-shadow: 0 0 40px rgba(99,102,241,0.5);
      margin-bottom: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .load-title { font-size: 22px; font-weight: 800; color: #E2E8F0; letter-spacing: -0.3px; }
    .load-title span { color: #6366F1; }
    .load-sub { font-size: 12px; color: #475569; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading">
    <div class="load-logo">⚡</div>
    <div class="load-title">GATE<span>Forge</span></div>
    <div class="load-sub">Mission 2027</div>
  </div>

  <!-- PWA Install Banner -->
  <div id="install-banner">
    <p>📲 Install GateForge App <span>Add to home screen for best experience</span></p>
    <button id="install-btn">Install</button>
    <button id="dismiss-btn">✕</button>
  </div>

  <!-- React Root -->
  <div id="root"></div>

  <!-- React + Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Your GateForge App -->
  <script type="text/babel" src="GateForge-2.jsx" data-type="module"></script>

  <script>
    // Hide loading screen once app loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.classList.add('hide');
          setTimeout(() => loading.remove(), 400);
        }
      }, 800);
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // PWA Install Prompt
    let deferredPrompt;
    const banner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');
    const dismissBtn = document.getElementById('dismiss-btn');

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      // Show banner after 3 seconds
      setTimeout(() => banner.classList.add('show'), 3000);
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.classList.remove('show');
    });

    dismissBtn.addEventListener('click', () => {
      banner.classList.remove('show');
    });

    // Mount React App
    window.addEventListener('load', () => {
      if (window.App) {
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(window.App));
      }
    });
  </script>

</body>
</html>
